name: build_rocket_ship
dag_type: plain_text
description: A detailed, concurrent workflow that designs, manufactures, integrates,
  tests, and launches a rocket ship from mission definition to lift‑off.
nodes:
  define_mission_requirements:
    name: define_mission_requirements
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'List the mission requirements for the rocket: payload weight (kg), target
      orbit (inclination, altitude), desired launch window, and any budget or schedule
      constraints.'
    description: Specify payload mass, orbit, launch window, and cost constraints.
    agent: false
  establish_design_constraints:
    name: establish_design_constraints
    nodes_depended_on:
    - define_mission_requirements
    nodes_dependent_on: []
    prompt: Given the mission requirements, outline the maximum thrust, vehicle length,
      diameter, structural load factors, thermal exposure, and allowable mass budget
      for each subsystem.
    description: Derive structural, thermal, and performance limits from mission requirements.
    agent: false
  create_overall_system_architecture:
    name: create_overall_system_architecture
    nodes_depended_on:
    - establish_design_constraints
    nodes_dependent_on: []
    prompt: Sketch a block diagram of the rocket showing propulsion, structural, avionics,
      guidance, thermal protection, and payload integration, labeling all key interfaces.
    description: Produce a high‑level block diagram showing major subsystems and their
      interfaces.
    agent: false
  design_propulsion_system:
    name: design_propulsion_system
    nodes_depended_on:
    - establish_design_constraints
    nodes_dependent_on: []
    prompt: 'Design a propulsion system that meets the thrust requirement: choose
      between liquid, solid, or hybrid; specify propellant type, combustion chamber
      pressure, and nozzle expansion ratio.'
    description: Select engine type, thrust level, propellant, and nozzle geometry.
    agent: false
  design_structural_frame:
    name: design_structural_frame
    nodes_depended_on:
    - establish_design_constraints
    nodes_dependent_on: []
    prompt: Select aerospace‑grade materials (e.g., aluminum‑lithium, carbon‑fiber)
      and calculate wall thicknesses for fuselage, thrust structure, and payload fairing
      to satisfy the structural load factors.
    description: Define material selection, tube dimensions, and load‑bearing layout.
    agent: false
  design_guidance_and_control:
    name: design_guidance_and_control
    nodes_depended_on:
    - establish_design_constraints
    nodes_dependent_on: []
    prompt: 'Outline the guidance, navigation, and control (GNC) system: list inertial
      measurement units, GPS modules, flight computer hardware, and basic PID or state‑estimator
      algorithms.'
    description: Specify sensors, flight computer, and control algorithms.
    agent: false
  design_thermal_protection:
    name: design_thermal_protection
    nodes_depended_on:
    - establish_design_constraints
    nodes_dependent_on: []
    prompt: Select thermal protection system (TPS) material for the nose cone and
      vehicle skin, and calculate thickness needed to survive re‑entry heating for
      the specified orbit.
    description: Choose ablative or reusable TPS materials and configure coverage.
    agent: false
  draft_manufacturing_plan:
    name: draft_manufacturing_plan
    nodes_depended_on:
    - design_propulsion_system
    - design_structural_frame
    - design_guidance_and_control
    - design_thermal_protection
    nodes_dependent_on: []
    prompt: Generate a Gantt‑style schedule listing machining, composite lay‑up, electronics
      assembly, and testing activities, with estimated labor hours and required shop
      equipment.
    description: Create a schedule and resource list for fabricating all subsystems.
    agent: false
  procure_materials:
    name: procure_materials
    nodes_depended_on:
    - design_structural_frame
    - design_propulsion_system
    - design_thermal_protection
    nodes_dependent_on: []
    prompt: Provide a table of required materials (e.g., aluminum sheets, carbon‑fiber
      prepreg, high‑temperature insulation) with vendor names, part numbers, quantities,
      and lead times.
    description: Identify suppliers and order all raw materials and components.
    agent: false
  fabricate_propulsion_components:
    name: fabricate_propulsion_components
    nodes_depended_on:
    - design_propulsion_system
    - procure_materials
    nodes_dependent_on: []
    prompt: Detail the step‑by‑step machining and assembly process for the propulsion
      hardware, including welding, brazing, and pressure testing procedures.
    description: Manufacture engine chamber, injector, tanks, and plumbing.
    agent: false
  fabricate_structural_components:
    name: fabricate_structural_components
    nodes_depended_on:
    - design_structural_frame
    - procure_materials
    nodes_dependent_on: []
    prompt: Describe the composite lay‑up and metal fabrication steps to create the
      primary load‑bearing structures, including curing cycles and dimensional inspection
      criteria.
    description: Build fuselage sections, interstage rings, and payload fairing.
    agent: false
  assemble_avionics_suite:
    name: assemble_avionics_suite
    nodes_depended_on:
    - design_guidance_and_control
    - procure_materials
    nodes_dependent_on: []
    prompt: List the wiring harness layout, connector types, and board mounting procedures
      required to assemble the full avionics suite.
    description: Integrate flight computer, sensors, wiring harnesses, and power distribution.
    agent: false
  apply_thermal_protection:
    name: apply_thermal_protection
    nodes_depended_on:
    - design_thermal_protection
    - fabricate_structural_components
    nodes_dependent_on: []
    prompt: Provide the installation sequence for ablative or reusable TPS, including
      bonding methods, overlap patterns, and post‑install inspection steps.
    description: Install TPS tiles, blankets, and sealants on vehicle exterior.
    agent: false
  integrate_subsystems:
    name: integrate_subsystems
    nodes_depended_on:
    - fabricate_propulsion_components
    - fabricate_structural_components
    - assemble_avionics_suite
    - apply_thermal_protection
    nodes_dependent_on: []
    prompt: 'Outline the integration flow: attach engine to thrust structure, route
      propellant lines, mount avionics bay, and secure payload fairing. Include alignment
      tolerances and torque specifications.'
    description: Combine propulsion, structure, avionics, and TPS into a complete
      vehicle.
    agent: false
  perform_static_fire_test:
    name: perform_static_fire_test
    nodes_depended_on:
    - integrate_subsystems
    nodes_dependent_on: []
    prompt: Describe the test setup, data acquisition parameters (thrust, chamber
      pressure, temperature), and acceptance criteria for the static fire.
    description: Fire the engine while vehicle is anchored to verify thrust and performance.
    agent: false
  conduct_vibration_and_acoustic_test:
    name: conduct_vibration_and_acoustic_test
    nodes_depended_on:
    - integrate_subsystems
    nodes_dependent_on: []
    prompt: Specify the test rig settings, frequency sweep range, and sensor placement
      for a qualification vibration test, and define pass/fail thresholds.
    description: Expose the assembled rocket to launch‑load vibration and acoustic
      environments.
    agent: false
  prepare_launch_site:
    name: prepare_launch_site
    nodes_depended_on:
    - define_mission_requirements
    nodes_dependent_on: []
    prompt: List the required launch‑pad elements (tower, gantry, flame trench), safety
      perimeter dimensions, and fueling infrastructure needed for the rocket.
    description: Set up pad infrastructure, fueling lines, and safety zones.
    agent: false
  final_inspection_and_certification:
    name: final_inspection_and_certification
    nodes_depended_on:
    - perform_static_fire_test
    - conduct_vibration_and_acoustic_test
    - prepare_launch_site
    nodes_dependent_on: []
    prompt: Compile a checklist of inspection items (dimensional, electrical, propellant
      leak) and summarize test results to certify the vehicle for launch.
    description: Review all test data, perform visual checks, and issue launch clearance.
    agent: false
  execute_launch:
    name: execute_launch
    nodes_depended_on:
    - final_inspection_and_certification
    - prepare_launch_site
    - integrate_subsystems
    nodes_dependent_on: []
    prompt: Provide a step‑by‑step launch timeline from vehicle roll‑out to engine
      ignition, liftoff, stage separation, and payload deployment, noting key event
      triggers.
    description: Carry out the launch sequence and achieve orbit.
    agent: false
